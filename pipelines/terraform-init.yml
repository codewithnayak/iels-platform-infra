trigger: none
pr: none

pool:
  name: IELS-SelfHosted

variables:
  azureServiceConnection: "sc-iels-azure-dev"
  terraformWorkingDirectory: "environments/dev"

steps:
  - checkout: self

  - task: AzureCLI@2
    displayName: "Terraform Init and Validate"
    inputs:
      azureSubscription: "$(azureServiceConnection)"
      scriptType: "bash"
      scriptLocation: "inlineScript"
      addSpnToEnvironment: true
      workingDirectory: "$(Build.SourcesDirectory)/$(terraformWorkingDirectory)"
      inlineScript: |
        set -euo pipefail

        export ARM_USE_OIDC=true
        export ARM_USE_AZUREAD=true
        export ARM_CLIENT_ID="$servicePrincipalId"
        export ARM_TENANT_ID="$tenantId"
        export ARM_SUBSCRIPTION_ID="$(az account show --query id -o tsv)"
        export ARM_OIDC_TOKEN="$idToken"

        echo "Initializing Terraform..."
        terraform init -input=false

        echo "Checking Terraform formatting..."
        terraform fmt -check -recursive

        echo "Validating Terraform configuration..."
        terraform validate

        echo "Terraform initialization and validation completed."
